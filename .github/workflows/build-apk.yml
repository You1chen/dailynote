name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'test/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/daily-note-keystore.jks
            echo "$KEYSTORE_PROPERTIES" > android/keystore.properties
            echo "✅ 签名密钥已配置"
          else
            echo "⚠️ 未配置签名密钥，使用默认 debug 签名（无法覆盖安装）"
          fi

      - name: Run Tests
        run: npm test

      - name: Build Web App & Sync
        env:
          CAPACITOR: 'true'
        run: |
          npx tsc --noEmit
          npx vite build
          npx cap sync android

      - name: Generate App Icons
        run: npm run cap:assets

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 记-debug.apk
          path: android/app/build/outputs/apk/debug/记.apk
          retention-days: 30
