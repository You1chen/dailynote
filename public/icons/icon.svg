  <circle cx="180" cy="176" r="12" fill="white" opacity="0.4"/>
  <circle cx="332" cy="176" r="12" fill="white" opacity="0.4"/>
  <!-- 日历横线 -->
  <line x1="160" y1="248" x2="352" y2="248" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <line x1="160" y1="296" x2="352" y2="296" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <line x1="160" y1="344" x2="280" y2="344" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <!-- 对勾 -->
